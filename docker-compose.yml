version: "3.8"

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DAY1_SALT=${DAY1_SALT}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  pgdata: